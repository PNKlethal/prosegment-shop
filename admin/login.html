<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — ПРО-сегмент</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#f4f4f4;font-family:Arial,sans-serif}
  .card{background:#fff;border-radius:12px;padding:48px 40px;width:100%;max-width:380px;
    box-shadow:0 2px 16px rgba(0,0,0,.08)}
  .logo{text-align:center;margin-bottom:32px}
  .logo img{width:56px;height:56px;border-radius:50%}
  .logo p{font-size:18px;font-weight:700;color:#080808;margin-top:10px}
  label{display:block;font-size:13px;color:#555;margin-bottom:6px;font-weight:700}
  input{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:6px;
    font-size:15px;outline:none;transition:border-color .15s}
  input:focus{border-color:#F95215}
  .field{margin-bottom:18px}
  button{width:100%;padding:14px;background:#F95215;color:#fff;border:none;
    border-radius:6px;font-size:16px;font-weight:700;cursor:pointer;transition:background .15s}
  button:hover{background:#e04510}
  .error{color:#cf1322;font-size:13px;margin-top:12px;text-align:center;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="https://drive.google.com/uc?export=view&id=1R_6vVGS353pg995sDScC16Pn_XQH5DTf" alt="ПРО-сегмент">
    <p>Панель управления</p>
  </div>
  <div class="field">
    <label>Логин</label>
    <input type="text" id="login" placeholder="admin" autocomplete="username">
  </div>
  <div class="field">
    <label>Пароль</label>
    <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button onclick="doLogin()">Войти →</button>
  <div class="error" id="err">Неверный логин или пароль</div>
</div>
<script>
document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
async function doLogin() {
  const login = document.getElementById('login').value;
  const pass  = document.getElementById('pass').value;
  const res   = await fetch('/admin/login-post', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({login, pass})
  });
  if (res.ok) { window.location = '/admin/'; }
  else { document.getElementById('err').style.display = 'block'; }
}
</script>
</body>
</html>
